[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbg-et-decomposition"
version = "0.1.0"
description = "Auditable decomposition of local electron-transfer rates in moire graphene"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
tbg-et = "tbg_et.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
